name: medexplain

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-medexplain}
      MYSQL_USER: ${DB_USERNAME:-medexplain}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medexplain}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-medexplain}
      DB_USERNAME: ${DB_USERNAME:-medexplain}
      DB_PASSWORD: ${DB_PASSWORD:-medexplain}
      REDIS_HOST: redis
      FASTAPI_BASE_URL: http://ai-service:8000/api/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-medexplain}
      DB_USERNAME: ${DB_USERNAME:-medexplain}
      DB_PASSWORD: ${DB_PASSWORD:-medexplain}
      REDIS_HOST: redis
      FASTAPI_BASE_URL: http://ai-service:8000/api/v1
    volumes:
      - document_storage:/var/www/html/storage/app/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=110", "--max-time=3600"]
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-medexplain}
      DB_USERNAME: ${DB_USERNAME:-medexplain}
      DB_PASSWORD: ${DB_PASSWORD:-medexplain}
      REDIS_HOST: redis
      FASTAPI_BASE_URL: http://ai-service:8000/api/v1
    volumes:
      - document_storage:/var/www/html/storage/app/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan queue"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-dev-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
  document_storage: